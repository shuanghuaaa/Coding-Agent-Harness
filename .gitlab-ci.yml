image: node:22

stages:
  - test
  - build

unit-test:
  stage: test
  script:
    - npm ci
    - npm test

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t coding-agent-harness:latest .
  only:
    - master
    - main
    - merge_requests
